name: AAB firmado para Google Play

# Compila la app desde el commit exacto de .github/play-release.env, firma el AAB con la clave de
# SUBIDA guardada en los secretos de GitHub y verifica firma, paquete, versión y commit antes de
# publicarlo como artefacto para subirlo a Play Console. Nunca muestra la clave ni las contraseñas.
on:
  push:
    branches: [ 'release/**', 'firma/**' ]
    paths:
      - '.github/play-release.env'
      - '.github/workflows/play-aab.yml'
  workflow_dispatch:

concurrency:
  group: play-aab-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firmar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar flujo y configuración de la versión
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer la versión a publicar
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          get() { sed -n "s/^$1=//p" .github/play-release.env | tr -d '[:space:]'; }
          for k in APP_COMMIT PACKAGE_NAME VERSION_NAME VERSION_CODE UPLOAD_CERT_SHA256; do
            v="$(get $k)"; [ -n "$v" ] || { echo "::error title=Configuración::Falta $k en .github/play-release.env"; exit 1; }
            echo "$k=$v" >> "$GITHUB_ENV"
          done
          app="$(get APP_COMMIT)"
          git cat-file -e "${app}^{commit}" || { echo "::error title=Configuración::El commit $app no existe en el repositorio"; exit 1; }
          # Solo se firma código que ya forma parte de esta rama (evita firmar un commit ajeno).
          git merge-base --is-ancestor "$app" HEAD || { echo "::error title=Configuración::$app no pertenece a la historia de ${GITHUB_REF_NAME}"; exit 1; }

      - name: Descargar el código de la app en ese commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_COMMIT }}
          path: app-src
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de subida (secretos)
        shell: bash
        env:
          K: ${{ secrets.DESPIERTA_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.DESPIERTA_UPLOAD_STORE_PASSWORD }}
          KP: ${{ secrets.DESPIERTA_UPLOAD_KEY_PASSWORD }}
          KA: ${{ secrets.DESPIERTA_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$K" ] || missing="$missing DESPIERTA_UPLOAD_KEYSTORE_BASE64"
          [ -n "$SP" ] || missing="$missing DESPIERTA_UPLOAD_STORE_PASSWORD"
          [ -n "$KP" ] || missing="$missing DESPIERTA_UPLOAD_KEY_PASSWORD"
          [ -n "$KA" ] || missing="$missing DESPIERTA_UPLOAD_KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error title=Secretos::Faltan:$missing"; exit 1; fi
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SP="$(trim "$SP")"; KP="$(trim "$KP")"; KA="$(trim "$KA")"
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          umask 077
          printf '%s' "$K" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null \
            || { echo "::error title=Secretos::DESPIERTA_UPLOAD_KEYSTORE_BASE64 no es un base64 válido"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$SP" -alias "$KA" >/dev/null 2>&1 \
            || { echo "::error title=Secretos::La clave no abre con esa contraseña o ese alias"; exit 1; }
          # Las contraseñas no se guardan en el entorno del trabajo: solo las recibe el paso de compilación.

      - name: Compilar el AAB firmado
        working-directory: app-src
        shell: bash
        env:
          SP: ${{ secrets.DESPIERTA_UPLOAD_STORE_PASSWORD }}
          KP: ${{ secrets.DESPIERTA_UPLOAD_KEY_PASSWORD }}
          KA: ${{ secrets.DESPIERTA_UPLOAD_KEY_ALIAS }}
        run: |
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          export DESPIERTA_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          export DESPIERTA_UPLOAD_STORE_PASSWORD="$(trim "$SP")"
          export DESPIERTA_UPLOAD_KEY_PASSWORD="$(trim "$KP")"
          export DESPIERTA_UPLOAD_KEY_ALIAS="$(trim "$KA")"
          unset SP KP KA
          # Sin GITHUB_SHA, el commit grabado en la app es el del código (APP_COMMIT), no el del flujo.
          env -u GITHUB_SHA ./gradlew --no-daemon bundleRelease --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1 || {
            grep -E "^e: |error:|FAILED|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" | head -40
            exit 1
          }

      - name: Borrar la clave del disco
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Verificar firma, paquete, versión y commit
        shell: bash
        run: |
          set -euo pipefail
          aab="$(ls app-src/app/build/outputs/bundle/release/*.aab | head -1)"
          out="play-out"; mkdir -p "$out"
          name="Despierta-${VERSION_NAME}-${VERSION_CODE}-play-firmado.aab"
          cp "$aab" "$out/$name"
          fail() { echo "::error title=Verificación::$1"; exit 1; }

          LANG=C jarsigner -verify "$out/$name" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || true
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt" || fail "El AAB no está firmado o la firma no es válida."
          cert="$(keytool -printcert -jarfile "$out/$name" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d '[:space:]')"
          [ "$cert" = "$UPLOAD_CERT_SHA256" ] || fail "La huella del certificado ($cert) no coincide con UPLOAD_CERT_SHA256."

          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          bt() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$out/$name" --xpath "$1" | tr -d '[:space:]'; }
          pkg="$(bt /manifest/@package)"
          vcode="$(bt /manifest/@android:versionCode)"
          vname="$(bt /manifest/@android:versionName)"
          debuggable="$(bt /manifest/application/@android:debuggable || true)"
          [ "$pkg" = "$PACKAGE_NAME" ] || fail "Paquete $pkg, se esperaba $PACKAGE_NAME."
          [ "$vcode" = "$VERSION_CODE" ] || fail "versionCode $vcode, se esperaba $VERSION_CODE."
          [ "$vname" = "$VERSION_NAME" ] || fail "versionName $vname, se esperaba $VERSION_NAME."
          [ "$debuggable" != "true" ] || fail "El AAB es depurable: Google Play lo rechazaría."

          unzip -p "$out/$name" 'base/dex/classes*.dex' | strings > "$RUNNER_TEMP/dex.txt"
          grep -Fq "${APP_COMMIT:0:12}" "$RUNNER_TEMP/dex.txt" || fail "La app no lleva grabado el commit ${APP_COMMIT:0:12}."
          if grep -Fq "ca-app-pub-3940256099942544" "$RUNNER_TEMP/dex.txt"; then
            ads="identificadores de PRUEBA de Google (no generan ingresos; aptos para pruebas cerradas)"
          else
            ads="identificadores REALES"
          fi

          {
            echo "Despierta para Google Play — verificación automática"
            echo "archivo=$name"
            echo "sha256=$(sha256sum "$out/$name" | cut -d' ' -f1)"
            echo "paquete=$pkg"
            echo "versionName=$vname"
            echo "versionCode=$vcode"
            echo "commit_app=$APP_COMMIT"
            echo "commit_flujo=$GITHUB_SHA"
            echo "firma=válida (jarsigner)"
            echo "certificado_subida_sha256=$cert"
            echo "anuncios=$ads"
          } > "$out/VERIFICACION.txt"
          cp app-src/CHANGELOG.md "$out/CAMBIOS.md" 2>/dev/null || true
          echo "::notice title=AAB listo para Google Play::$name · $pkg · versión $vname ($vcode) · commit ${APP_COMMIT:0:12} · certificado $cert · anuncios con $ads"

      - name: Publicar el AAB firmado
        uses: actions/upload-artifact@v4
        with:
          name: Despierta-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-play-firmado
          path: play-out/
          if-no-files-found: error
          retention-days: 30
