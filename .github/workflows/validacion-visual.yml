name: Validación visual

# Compara la pantalla de Alarmas de una base (commit en .github/validacion-base) con la
# candidata (este commit) en el mismo emulador. Solo corre en ramas validacion/**: no genera
# APK para distribuir ni cambia versiones.
on:
  push:
    branches: [ 'validacion/**' ]

concurrency:
  group: validacion-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        pantalla: [ pixel6, telefono ]
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar candidata y pruebas
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/despues.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/pruebas.apk"

      - name: Compilar base
        run: |
          base="$(tr -d '[:space:]' < .github/validacion-base)"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          git worktree add -q "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && ./gradlew assembleDebug --stacktrace)
          cp "$RUNNER_TEMP/base/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/antes.apk"

      - name: Capturas antes y después (Android 14)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            mkdir -p validacion
            bash .github/scripts/wait-for-android.sh validacion/emulator-readiness.txt
            bash .github/scripts/visual-validation.sh validacion "$RUNNER_TEMP/antes.apk" "$RUNNER_TEMP/despues.apk" "$RUNNER_TEMP/pruebas.apk" ${{ matrix.pantalla }}

      - name: Publicar en la rama validacion-capturas
        if: always()
        run: bash .github/scripts/publish-validation.sh validacion "${{ github.sha }}" "$BASE_SHA" ${{ matrix.pantalla }}
