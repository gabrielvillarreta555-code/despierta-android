name: AdMob experimental

# Rama experimental/**: compila con publicidad de PRUEBA, audita permisos y componentes del
# APK, ejecuta las suites de alarmas y la prueba de impacto de anuncios. No publica APK.
on:
  push:
    branches: [ 'experimental/**', 'release/**' ]

concurrency:
  group: admob-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias, análisis y APK
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=Compilación::/'
            exit $status
          fi
      - name: Auditoría del APK con publicidad
        shell: bash
        run: |
          note() { local t="$1"; local body; body="$(cat | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')"; echo "::notice title=$t::$body"; }
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          aapt2="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump permissions "$apk" | note "Permisos con publicidad"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -E "E: (provider|service|receiver|activity)" -A3 | grep -E "E: |android:name" | sed -E 's/.*\(Raw: "([^"]+)"\)/  \1/' | note "Componentes con publicidad"
          ls -l app/build/outputs/apk/release/*.apk | awk '{print $5, $9}' | note "Tamaño del APK de publicación (sin minimizar)"

  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Suites de alarmas y prueba de impacto (Android 14, Google APIs)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            mkdir -p salida
            bash .github/scripts/wait-for-android.sh salida/emulator-readiness.txt
            bash .github/scripts/install-apk-with-retry.sh app/build/outputs/apk/debug/app-debug.apk salida/app-install.txt
            bash .github/scripts/install-apk-with-retry.sh app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk salida/test-install.txt
            bash .github/scripts/ads-stability.sh salida
            bash .github/scripts/run-instrumented-suites.sh salida "Android 14 con publicidad de prueba" || true
            bash .github/scripts/ads-impact.sh salida
      - name: Publicar capturas de la publicidad
        if: always()
        shell: bash
        run: |
          set -e
          [ -d salida/anuncios ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pub="$RUNNER_TEMP/pub"
          if git ls-remote --exit-code --heads origin admob-capturas >/dev/null 2>&1; then
            git fetch -q origin admob-capturas && git worktree add -q -B admob-capturas "$pub" FETCH_HEAD
          else
            git worktree add -q --detach "$pub" && (cd "$pub" && git checkout -q --orphan admob-capturas && git rm -rfq . && git clean -fdxq)
          fi
          rm -rf "$pub/capturas" && mkdir -p "$pub/capturas" && cp salida/anuncios/*.png "$pub/capturas/" 2>/dev/null || true
          cp salida/ads-*.txt "$pub/" 2>/dev/null || true
          echo "${{ github.sha }}" > "$pub/SOURCE_COMMIT"
          cd "$pub" && git add -A && git commit -q --allow-empty -m "Capturas de publicidad de ${GITHUB_SHA:0:12}" && git push -q origin admob-capturas
