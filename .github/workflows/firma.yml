name: Firma del AAB

# Compila el AAB de publicación firmado con la clave de subida de los secretos y muestra solo
# la huella pública del certificado (nunca la clave ni las contraseñas). Ramas firma/**.
on:
  push:
    branches: [ 'firma/**' ]

permissions:
  contents: read

jobs:
  firmar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar que existen los cuatro secretos
        shell: bash
        env:
          K: ${{ secrets.DESPIERTA_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.DESPIERTA_UPLOAD_STORE_PASSWORD }}
          KP: ${{ secrets.DESPIERTA_UPLOAD_KEY_PASSWORD }}
          KA: ${{ secrets.DESPIERTA_UPLOAD_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$K" ] || missing="$missing DESPIERTA_UPLOAD_KEYSTORE_BASE64"
          [ -n "$SP" ] || missing="$missing DESPIERTA_UPLOAD_STORE_PASSWORD"
          [ -n "$KP" ] || missing="$missing DESPIERTA_UPLOAD_KEY_PASSWORD"
          [ -n "$KA" ] || missing="$missing DESPIERTA_UPLOAD_KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error title=Secretos::Faltan:$missing"; exit 1; fi
          echo "$K" | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null || { echo "::error title=Secretos::DESPIERTA_UPLOAD_KEYSTORE_BASE64 no es un base64 válido (¿se copió incompleto?)"; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storetype PKCS12 -storepass "$SP" -alias "$KA" >/dev/null 2>&1; then
            echo "::error title=Secretos::La clave no abre con esa contraseña o ese alias (revisa STORE_PASSWORD y KEY_ALIAS, o el base64 incompleto)."; exit 1
          fi
          echo "DESPIERTA_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "::notice title=Secretos::Los cuatro secretos existen y la clave abre correctamente."
      - name: Compilar AAB firmado
        env:
          DESPIERTA_UPLOAD_STORE_PASSWORD: ${{ secrets.DESPIERTA_UPLOAD_STORE_PASSWORD }}
          DESPIERTA_UPLOAD_KEY_ALIAS: ${{ secrets.DESPIERTA_UPLOAD_KEY_ALIAS }}
          DESPIERTA_UPLOAD_KEY_PASSWORD: ${{ secrets.DESPIERTA_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
      - name: Verificar firma (solo la huella pública)
        shell: bash
        run: |
          aab="$(ls app/build/outputs/bundle/release/*.aab | head -1)"
          jarsigner -verify "$aab" >/dev/null 2>&1 && ok="firma válida" || ok="FIRMA NO VÁLIDA"
          fp="$(keytool -printcert -jarfile "$aab" | grep -m1 'SHA256:' | sed 's/^\s*//')"
          echo "::notice title=AAB firmado::$(basename "$aab") — $ok — $fp"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Despierta-2.8-aab-firmado
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
